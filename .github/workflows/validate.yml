name: Validate theme

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Pack and re-validate the bundle
        run: |
          npm run pack
          npm run validate -- dist/cavanagh-*.seerrtheme
          (cd dist && sha256sum --check ./*.sha256)
