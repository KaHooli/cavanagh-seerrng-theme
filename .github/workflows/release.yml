name: Publish theme package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate theme and tag
        run: |
          npm run validate
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./cavanagh/manifest.json').version")"
      - name: Pack theme
        run: |
          npm run pack
          npm run validate -- dist/cavanagh-*.seerrtheme
          (cd dist && sha256sum --check ./*.sha256)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cavanagh-*.seerrtheme
            dist/cavanagh-*.seerrtheme.sha256
          generate_release_notes: true
